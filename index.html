<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ИИ-фото и печать</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
    }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: #f5f5f5;
      border-radius: 12px;
    }
    .control-group {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      min-width: 200px;
    }
    input[type="file"] { font-size: 0.95rem; }
    button {
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: #333;
      color: #fff;
      transition: background 0.2s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #555; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.secondary {
      background: #e0e0e0;
      color: #333;
    }
    button.secondary:hover:not(:disabled) { background: #d0d0d0; }
    button.print-btn {
      background: #2e7d32;
      margin-top: 1rem;
    }
    button.print-btn:hover:not(:disabled) { background: #1b5e20; }
    #preview-container {
      border: 2px dashed #ccc;
      border-radius: 12px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #fafafa;
    }
    #preview {
      max-width: 100%;
      max-height: 60vh;
      border-radius: 8px;
      display: none;
    }
    #status {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      margin-top: 0.5rem;
      min-height: 1.5rem;
    }

    /* Стили для печати: печатается только изображение */
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: center;
      }
      #printArea img {
        max-width: 100%;
        height: auto;
      }
    }
  </style>
</head>
<body>

  <h1>🎨 ИИ-фото и печать</h1>

  <!-- ===== Блок управления ===== -->
  <div class="controls">

    <!-- Генерация -->
    <div class="control-group">
      <input type="text" id="prompt" placeholder="Опишите картинку...">
      <button id="generateBtn">Сгенерировать</button>
    </div>

    <!-- Улучшение качества -->
    <div class="control-group">
      <input type="file" id="upload" accept="image/*">
      <button id="enhanceBtn" class="secondary">Улучшить качество</button>
    </div>

    <!-- Печать -->
    <button id="printBtn" class="print-btn" disabled>🖨️ Распечатать</button>
  </div>

  <!-- ===== Область предпросмотра ===== -->
  <div id="preview-container">
    <div id="printArea">
      <img id="preview" alt="Результат">
    </div>
  </div>
  <div id="status"></div>

  <!-- ===== Подключение UpscalerJS (CDN) ===== -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@upscalerjs/default-model@latest/dist/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/upscaler@latest/dist/browser/umd/upscaler.min.js"></script>

  <script>
    // ===== Инициализация UpscalerJS =====
    const upscaler = new Upscaler({
      model: DefaultUpscalerJSModel
    });

    // ===== DOM-элементы =====
    const promptInput   = document.getElementById('prompt');
    const generateBtn   = document.getElementById('generateBtn');
    const uploadInput   = document.getElementById('upload');
    const enhanceBtn    = document.getElementById('enhanceBtn');
    const preview       = document.getElementById('preview');
    const previewContainer = document.getElementById('preview-container');
    const printBtn      = document.getElementById('printBtn');
    const statusEl      = document.getElementById('status');

    // ===== Вспомогательные функции =====
    function setStatus(text) {
      statusEl.textContent = text;
    }

    function showImage(src) {
      preview.src = src;
      preview.style.display = 'block';
      printBtn.disabled = false;
    }

    // ===== Генерация через Pollinations.AI =====
    // URL: https://image.pollinations.ai/prompt/{prompt}?width=...&height=...&nologo=true&seed=...
    // Работает без API-ключа. CORS открыт, можно использовать как <img src>, так и fetch.

    generateBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        setStatus('⚠️ Введите описание картинки');
        return;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = 'Генерация...';
      setStatus('⏳ Генерирую изображение...');

      try {
        const width  = 1024;
        const height = 1024;
        const seed   = Date.now();

        const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${width}&height=${height}&nologo=true&seed=${seed}`;

        // Просто подставляем URL в <img> — браузер загрузит картинку
        preview.src = url;
        preview.style.display = 'block';
        printBtn.disabled = false;

        // Ждем загрузки, чтобы понять, что все ок
        await new Promise((resolve, reject) => {
          preview.onload = resolve;
          preview.onerror = reject;
        });

        setStatus('✅ Изображение готово');
      } catch (e) {
        setStatus('❌ Не удалось сгенерировать: ' + e.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = 'Сгенерировать';
      }
    });

    // ===== Улучшение качества через UpscalerJS =====
    // Модель загружается с CDN (~10-30 МБ), выполняется локально в браузере.
    // Никаких серверов, никаких ключей.

    enhanceBtn.addEventListener('click', async () => {
      const file = uploadInput.files[0];
      if (!file) {
        setStatus('⚠️ Выберите файл для улучшения');
        return;
      }

      enhanceBtn.disabled = true;
      enhanceBtn.textContent = 'Улучшение...';
      setStatus('⏳ Загружаю модель и улучшаю... (первый раз может занять время)');

      try {
        // Загружаем файл как изображение
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await img.decode();

        // Запускаем апскейл
        const upscaledSrc = await upscaler.upscale(img, {
          output: 'base64',
          patchSize: 64,
          padding: 4
        });

        showImage(upscaledSrc);
        setStatus('✅ Качество улучшено');
      } catch (e) {
        setStatus('❌ Ошибка улучшения: ' + e.message);
        console.error(e);
      } finally {
        enhanceBtn.disabled = false;
        enhanceBtn.textContent = 'Улучшить качество';
      }
    });

    // ===== Печать =====
    printBtn.addEventListener('click', () => {
      if (!preview.src) return;
      window.print(); // Откроется системный диалог выбора принтера
    });
  </script>

</body>
</html>
